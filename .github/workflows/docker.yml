name: Build & Push GHCR

on:
  push:
    branches:
      - master
      - dev
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag tambahan (opsional, misal: staging)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ env.IMAGE_OWNER }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Compute image name
      id: image
      run: |
        OWNER_LC=$(echo "${{ env.IMAGE_OWNER }}" | tr '[:upper:]' '[:lower:]')
        REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
        IMAGE="${{ env.REGISTRY }}/${OWNER_LC}/${REPO_NAME}"
        echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"
        echo "Image name: $IMAGE"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.image.outputs.IMAGE }}
        tags: |
          # Tag semver saat push tag vX.Y.Z
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          # Tag latest hanya dari branch master
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          # Tag branch name (master → master, dev → dev)
          type=ref,event=branch
          # Tag timestamp+sha untuk setiap push (unik, tidak bisa overwrite)
          type=raw,value={{date 'YYYYMMDDHHmmss'}}-{{sha}},enable=${{ github.event_name == 'push' }}
          # Tag manual dari workflow_dispatch input
          type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Summary
      run: |
        echo "## Docker Image" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "**Image:** \`${{ steps.image.outputs.IMAGE }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "**Tags dipush:**" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
