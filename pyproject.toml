[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowise-mcp-server"
version = "0.1.0"
description = "MCP server that exposes Flowise chatflows as tools for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Andhitia Rama", email = "andhitia.r@gmail.com" },
]
keywords = [
    "mcp",
    "flowise",
    "ai",
    "llm",
    "model-context-protocol",
    "rag",
    "chatflow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/andhit-r/flowise-mcp-server"
Repository = "https://github.com/andhit-r/flowise-mcp-server"
"Bug Tracker" = "https://github.com/andhit-r/flowise-mcp-server/issues"
Changelog = "https://github.com/andhit-r/flowise-mcp-server/blob/main/CHANGELOG.md"

[project.scripts]
flowise-mcp-server = "flowise_mcp_server.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "coverage[toml]>=7.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowise_mcp_server"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["flowise_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["src/flowise_mcp_server"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
